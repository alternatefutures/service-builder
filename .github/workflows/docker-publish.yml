name: af-builder-publish

on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'scripts/**', '.github/workflows/docker-publish.yml']

concurrency:
  group: af-builder-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/af-builder

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      packages: write
      id-token: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate phased credential and immutable-input boundaries
        run: bash scripts/test-phases.sh

      - name: Set up pinned Buildx and BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve immutable image reference
        id: image
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${BUILD_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'build did not emit a valid digest' >&2
            exit 1
          fi
          image_ref="${IMAGE}@${BUILD_DIGEST}"
          echo "ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "BUILDER_IMAGE=${image_ref}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3
        with:
          cosign-release: v2.6.5

      - name: Install checksummed Syft and Trivy
        env:
          SYFT_VERSION: '1.51.1'
          SYFT_SHA256: '8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3'
          TRIVY_VERSION: '0.70.0'
          TRIVY_SHA256: '8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9'
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${SYFT_SHA256}" "${RUNNER_TEMP}/syft.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${RUNNER_TEMP}" syft
          sudo install -m 0555 "${RUNNER_TEMP}/syft" /usr/local/bin/syft
          curl -fsSLo "${RUNNER_TEMP}/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "${TRIVY_SHA256}" "${RUNNER_TEMP}/trivy.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}" trivy
          sudo install -m 0555 "${RUNNER_TEMP}/trivy" /usr/local/bin/trivy
          test "$(syft version -o json | jq -r .version)" = "${SYFT_VERSION}"
          test "$(trivy --version | awk 'NR == 1 {print $2}')" = "${TRIVY_VERSION}"

      - name: Generate exact-image SBOM
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: syft "${IMAGE_REF}" -o cyclonedx-json=sbom.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: af-builder-sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90
          if-no-files-found: error

      - name: Reject critical vulnerabilities
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          trivy image --timeout 15m --scanners vuln --severity CRITICAL \
            --exit-code 1 --format table "${IMAGE_REF}"

      - name: Sign and attest verified image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_REF}"
          cosign attest --yes --predicate sbom.cyclonedx.json \
            --type cyclonedx "${IMAGE_REF}"

      - name: Verify exact signing identity and SBOM attestation
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/docker-publish.yml@refs/heads/main
          CERTIFICATE_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cosign verify --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${CERTIFICATE_ISSUER}" "${IMAGE_REF}" >/dev/null
          cosign verify-attestation --type cyclonedx \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${CERTIFICATE_ISSUER}" "${IMAGE_REF}" >/dev/null
